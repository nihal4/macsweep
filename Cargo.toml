[package]
name = "macsweep"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
jwalk = "0.9.0"
libc = "0.2.191"
plist = "1.10.3"
rayon = "1.12.0"
trash = "5.3.0"

# Linux only so the code can be checked on Linux; macOS needs nothing extra
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
