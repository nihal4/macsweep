# Push a tag like v0.1.0 and GitHub builds a universal MacSweep.app
# and attaches it to a new Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build universal app
        run: ADHOC=1 UNIVERSAL=1 ZIP=1 ./bundle.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacSweep-*.zip
          generate_release_notes: true
          body: |
            **Download `MacSweep-*.zip`, unzip, and move MacSweep to Applications.**

            The app isn't notarized by Apple yet, so the first time:
            right-click MacSweep → **Open** → **Open**, or run
            `xattr -dr com.apple.quarantine /Applications/MacSweep.app`.

            Then enable it in System Settings → Privacy & Security → Full Disk Access.
            Works on Apple Silicon and Intel Macs (macOS 11+).
