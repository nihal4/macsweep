[package]
name = "macsweep-monitor"
version = "0.3.0"
edition = "2024"
description = "MacSweep's tiny menu-bar monitor (CPU, memory, disk)"
license = "MIT"
repository = "https://github.com/nihal4/macsweep"
authors = ["S. M. Nihal Ahmed"]

# Only native macOS frameworks: no graphics engine, no async runtime.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
